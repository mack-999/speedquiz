<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedquiz</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #progress {
      margin-bottom: 20px;
      color: #aaa;
    }

    img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 14px;
      background: #222;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 18px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #2f7df6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1f5fc0;
    }

    .nextBtn {
      margin-top: 20px;
      background: #22c55e;
    }

    .feedback {
      margin-top: 20px;
      font-size: 22px;
    }

    .correct {
      color: #4ade80;
    }

    .wrong {
      color: #f87171;
    }

    .summary {
      margin-top: 30px;
      text-align: left;
    }

    .summary-item {
      background: #222;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Speedquiz</h1>

  <div id="progress"></div>

  <img id="quizImage">

  <div id="options" class="options"></div>

  <div id="feedback" class="feedback"></div>

  <button id="nextBtn" class="nextBtn" style="display:none;">
    Weiter
  </button>

  <div id="summary" class="summary"></div>

</div>

<script>

const questions = [

  {
    normalImage: "10_normal.jpg",
    solutionImage: "10_solution.jpg",
    correct: 120,
    options: [80, 100, 120, 160]
  },

  {
    normalImage: "11_normal.jpg",
    solutionImage: "11_solution.jpg",
    correct: 90,
    options: [60, 90, 130, 180]
  },

  {
    normalImage: "12_normal.jpg",
    solutionImage: "12_solution.jpg",
    correct: 150,
    options: [110, 130, 150, 200]
  }

];

let currentQuestion = 0;
let score = 0;
let answers = [];

const quizImage = document.getElementById("quizImage");
const optionsDiv = document.getElementById("options");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");
const summary = document.getElementById("summary");

function loadQuestion() {

  const q = questions[currentQuestion];

  progress.innerHTML =
    `Frage ${currentQuestion + 1} / ${questions.length}`;

  quizImage.style.display = "block";
  quizImage.src = q.normalImage;

  optionsDiv.innerHTML = "";
  feedback.innerHTML = "";
  nextBtn.style.display = "none";

  q.options.forEach(option => {

    const btn = document.createElement("button");

    btn.innerText = option + " km/h";

    btn.onclick = () => selectAnswer(option);

    optionsDiv.appendChild(btn);

  });

}

function selectAnswer(selected) {

  const q = questions[currentQuestion];

  const correct = selected === q.correct;

  if(correct) score++;

  answers.push({
    question: currentQuestion + 1,
    selected,
    correctAnswer: q.correct,
    correct
  });

  quizImage.src = q.solutionImage;

  optionsDiv.innerHTML = "";

  if(correct) {

    feedback.innerHTML =
      `<div class="correct">
        ✅ Richtig!<br>
        ${q.correct} km/h
      </div>`;

  } else {

    feedback.innerHTML =
      `<div class="wrong">
        ❌ Falsch<br><br>
        Deine Antwort:
        ${selected} km/h<br>
        Richtige Antwort:
        ${q.correct} km/h
      </div>`;

  }

  nextBtn.style.display = "inline-block";

}

nextBtn.onclick = () => {

  currentQuestion++;

  if(currentQuestion < questions.length) {

    loadQuestion();

  } else {

    showSummary();

  }

};

function showSummary() {

  quizImage.style.display = "none";
  optionsDiv.innerHTML = "";
  feedback.innerHTML = "";
  nextBtn.style.display = "none";

  progress.innerHTML = "Quiz beendet";

  summary.innerHTML =
    `<h2>
      Ergebnis:
      ${score} / ${questions.length}
    </h2>`;

  answers.forEach(a => {

    summary.innerHTML +=
      `<div class="summary-item">

        <strong>
          Frage ${a.question}
        </strong><br><br>

        Deine Antwort:
        ${a.selected} km/h<br>

        Richtige Antwort:
        ${a.correctAnswer} km/h<br><br>

        ${a.correct ? "✅ Richtig" : "❌ Falsch"}

      </div>`;

  });

}

loadQuestion();

</script>

</body>
</html>
