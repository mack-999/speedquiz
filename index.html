<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speedquiz</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    img {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 12px;
      background: #222;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 16px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2f7df6;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #1f5fc0;
    }

    .result {
      margin-top: 20px;
      font-size: 20px;
    }

    .correct {
      color: #4ade80;
    }

    .wrong {
      color: #f87171;
    }

    .summary {
      text-align: left;
      margin-top: 20px;
    }

    .summary-item {
      background: #222;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .next {
      margin-top: 20px;
      background: #22c55e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Speedquiz</h1>
    <p id="progress"></p>

    <img id="quizImage" src="" alt="Quizbild" />

    <div id="options" class="options"></div>

    <div id="feedback" class="result"></div>

    <button id="nextButton" class="next" style="display:none;">Weiter</button>

    <div id="summary" class="summary"></div>
  </div>

  <script>
    const questions = [
      {
        normalImage: "images/1_normal.jpg",
        solutionImage: "images/1_solution.jpg",
        correct: 120,
        options: [80, 100, 120, 160]
      },
      {
        normalImage: "images/2_normal.jpg",
        solutionImage: "images/2_solution.jpg",
        correct: 90,
        options: [60, 90, 130, 180]
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answers = [];

    const quizImage = document.getElementById("quizImage");
    const optionsDiv = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");
    const summary = document.getElementById("summary");

    function loadQuestion() {
      const q = questions[currentQuestion];

      progress.textContent = `Frage ${currentQuestion + 1} von ${questions.length}`;
      quizImage.src = q.normalImage;
      feedback.innerHTML = "";
      optionsDiv.innerHTML = "";
      summary.innerHTML = "";
      nextButton.style.display = "none";

      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.textContent = option + " km/h";
        btn.onclick = () => selectAnswer(option);
        optionsDiv.appendChild(btn);
      });
    }

    function selectAnswer(selected) {
      const q = questions[currentQuestion];
      const isCorrect = selected === q.correct;

      if (isCorrect) score++;

      answers.push({
        question: currentQuestion + 1,
        selected,
        correct: q.correct,
        isCorrect
      });

      quizImage.src = q.solutionImage;
      optionsDiv.innerHTML = "";

      feedback.innerHTML = isCorrect
        ? `<span class="correct">Richtig! ${q.correct} km/h</span>`
        : `<span class="wrong">Falsch. Deine Antwort: ${selected} km/h<br>Richtig: ${q.correct} km/h</span>`;

      nextButton.style.display = "block";
    }

    nextButton.onclick = () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showSummary();
      }
    };

    function showSummary() {
      quizImage.style.display = "none";
      optionsDiv.innerHTML = "";
